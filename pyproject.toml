[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlights"
version = "0.1.0"
description = "A Raspberry Pi controller for addressable smart lights."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=12.3,<13",
    "requests>=2.32,<3",
    "spotipy>=2.26,<3",
]

[project.scripts]
smartlights = "smartlights.app:main"
smartlights-hardware-test = "smartlights.hardware_test:main"

[project.optional-dependencies]
dev = [
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]
hardware = [
    "rpi-ws281x>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["v1"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["^v1/"]

[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"